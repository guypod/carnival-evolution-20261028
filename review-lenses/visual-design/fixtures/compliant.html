<!doctype html>
<!-- Compliant sample for the visual-design lens: an illustrated stall with a
     drawn focal point and themed native controls. Colours copy
     src/carnival/theme.ts because a standalone fixture cannot import it;
     darker and lighter shades come only from opacity and gradients. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compliant sample</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #1b1035;
        color: #fff8e7;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        margin: 0 0 16px;
        color: #ffcc33;
      }
      .stall {
        display: grid;
        grid-template-columns: 3fr 2fr;
        border: 3px solid #8a5a3b;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 0 #8a5a3b;
        background: #2a1a52;
      }
      .counter {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 30px 20px 20px;
        border-left: 3px solid #8a5a3b;
        background:
          repeating-linear-gradient(90deg, #e63946 0 24px, #fff8e7 24px 48px) top / 100% 14px
            no-repeat,
          #2a1a52;
      }
      .board {
        margin: 0;
        padding: 10px 14px;
        border: 3px solid #8a5a3b;
        border-radius: 10px;
        background:
          linear-gradient(#fff8e7, #fff8e7) center 34px / calc(100% - 28px) 1px no-repeat,
          #1b1035;
        box-shadow: inset 0 0 0 2px rgba(255, 204, 51, 0.25);
      }
      .board h2 {
        margin: 0 0 12px;
        color: #ffcc33;
        font-size: 1rem;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
      }
      .board dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        margin: 0;
      }
      .board dt {
        color: #b9a9d9;
      }
      .board dd {
        margin: 0;
        color: #ffcc33;
        font-weight: bold;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      fieldset {
        display: flex;
        gap: 8px;
        margin: 0;
        border: 2px solid #8a5a3b;
        border-radius: 12px;
      }
      fieldset label {
        padding: 6px 12px;
        border: 2px solid #b9a9d9;
        border-radius: 999px;
        background: #1b1035;
      }
      fieldset label:has(:checked) {
        border-color: #ffcc33;
        font-weight: bold;
      }
      fieldset input {
        accent-color: #ffcc33;
      }
      .counter > label {
        font-weight: bold;
      }
      input[type='text'] {
        padding: 10px;
        border: 2px solid #8a5a3b;
        border-radius: 12px;
        background: #fff8e7;
        color: #1b1035;
        font: inherit;
      }
      button {
        padding: 10px;
        border: 2px solid #1b1035;
        border-radius: 12px;
        background: #ffcc33;
        color: #1b1035;
        font: inherit;
        font-weight: bold;
        box-shadow: 0 4px 0 #8a5a3b;
      }
      :focus-visible {
        outline: 3px solid #ffcc33;
        outline-offset: 2px;
      }
      @media (max-width: 720px) {
        .stall {
          grid-template-columns: 1fr;
        }
        .counter {
          border-left: 0;
          border-top: 3px solid #8a5a3b;
        }
      }
    </style>
